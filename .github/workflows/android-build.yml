name: Android build and unit tests

on:
  push:
    paths:
      - "OSE11P_Android/**"
      - "docs/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "OSE11P_Android/**"
      - "docs/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 34 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7 (project has no wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run unit tests and assemble debug APK
        run: gradle -p OSE11P_Android --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MonitorTune-debug-apk
          path: OSE11P_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
