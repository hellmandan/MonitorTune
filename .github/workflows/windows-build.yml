name: MonitorTune Windows Build

on:
  push:
    branches:
      - feature/voice-copilot
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install dependencies
        working-directory: windows
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Compile check
        working-directory: windows
        run: python -m py_compile main.py
      - name: Build executable
        working-directory: windows
        shell: cmd
        run: >-
          pyinstaller --noconfirm --clean --windowed --name MonitorTune
          --collect-all PySide6
          --collect-all PySide6.QtWebEngineCore
          --collect-all PySide6.QtWebEngineWidgets
          --collect-all pyqtgraph
          --collect-all pyttsx3
          --add-data "engine_scene.html;."
          main.py
      - name: Verify packaged HMI
        shell: pwsh
        run: |
          if (!(Test-Path "windows/dist/MonitorTune/MonitorTune.exe")) { throw "MonitorTune.exe missing" }
          $sceneCandidates = @(
            "windows/dist/MonitorTune/engine_scene.html",
            "windows/dist/MonitorTune/_internal/engine_scene.html"
          )
          if (!(($sceneCandidates | Where-Object { Test-Path $_ }).Count -gt 0)) {
            throw "engine_scene.html missing from package root and PyInstaller _internal directory"
          }
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MonitorTune-Windows
          path: windows/dist/MonitorTune/
          if-no-files-found: error
          retention-days: 90
